name: Opengrep SAST
description: Run Opengrep security-audit rulesets and upload SARIF (warn-only by default; set fail-on=true to block)
inputs:
  output:
    description: SARIF output path
    required: false
    default: reports/sarif/opengrep.sarif
  version:
    description: Opengrep pip package version to install
    required: false
    default: 1.27.1
  fail-on:
    description: Fail the workflow when findings are reported ('true') or only upload SARIF as informational ('false')
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p "$(dirname '${{ inputs.output }}')"
        pip install 'opengrep==${{ inputs.version }}' --quiet || pip3 install 'opengrep==${{ inputs.version }}' --quiet
        scan_exit=0
        opengrep scan --config p/security-audit --config p/java --config p/typescript --sarif --output '${{ inputs.output }}' --error || scan_exit=$?
        [ -f '${{ inputs.output }}' ] || echo '{"version":"2.1.0","runs":[]}' > '${{ inputs.output }}'
        if [ '${{ inputs.fail-on }}' = 'true' ] && [ "$scan_exit" -ne 0 ]; then
          echo 'opengrep reported findings (fail-on=true)' >&2
          exit 1
        fi
    # Pinned: upload-sarif v3 as of 2026-09-18 (3ea06614dafe36dec890db3446326e0d40ce53d4).
    # Keep updated via Dependabot; use the SHA, not the floating tag.
    - uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
      if: always()
      with:
        sarif_file: ${{ inputs.output }}
        category: opengrep
