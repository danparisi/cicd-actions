name: Zizmor workflow audit
description: Audit GitHub Actions workflows with Zizmor and upload SARIF (warn-only by default; set fail-on=true to block)
inputs:
  output:
    description: SARIF output path
    required: false
    default: reports/sarif/zizmor.sarif
  workflows:
    description: Glob of workflow files to audit
    required: false
    default: .github/workflows/*.yml
  version:
    description: Zizmor pip package version to install
    required: false
    default: 1.30.1
  fail-on:
    description: Fail the workflow when findings are reported ('true') or only upload SARIF as informational ('false')
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p "$(dirname '${{ inputs.output }}')"
        pip install 'zizmor==${{ inputs.version }}' --quiet || pip3 install 'zizmor==${{ inputs.version }}' --quiet
        scan_exit=0
        zizmor --format sarif ${{ inputs.workflows }} > '${{ inputs.output }}' || scan_exit=$?
        [ -f '${{ inputs.output }}' ] || echo '{"version":"2.1.0","runs":[]}' > '${{ inputs.output }}'
        if [ '${{ inputs.fail-on }}' = 'true' ] && [ "$scan_exit" -ne 0 ]; then
          echo 'zizmor reported findings (fail-on=true)' >&2
          exit 1
        fi
    # Pinned: upload-sarif v3 as of 2026-09-18 (3ea06614dafe36dec890db3446326e0d40ce53d4).
    # Keep updated via Dependabot; use the SHA, not the floating tag.
    - uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
      if: always()
      # Best-effort: code scanning may be disabled (private repos without GHAS).
      # SARIF files are still preserved via the caller's upload-artifact step.
      continue-on-error: true
      with:
        sarif_file: ${{ inputs.output }}
        category: zizmor
