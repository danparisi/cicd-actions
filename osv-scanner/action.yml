name: OSV-Scanner
description: Scan dependencies for known vulnerabilities with OSV-Scanner and upload SARIF (warn-only by default; set fail-on=true to block)
inputs:
  output:
    description: SARIF output path
    required: false
    default: reports/sarif/osv-scanner.sarif
  version:
    description: osv-scanner release version to install
    required: false
    default: 2.2.4
  fail-on:
    description: Fail the workflow when findings are reported ('true') or only upload SARIF as informational ('false')
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p "$(dirname '${{ inputs.output }}')"
        if ! command -v osv-scanner >/dev/null 2>&1; then
          curl -fsSL -o /tmp/osv-scanner.tar.gz "https://github.com/google/osv-scanner/releases/download/v${{ inputs.version }}/osv-scanner_linux_amd64.tar.gz"
          tar -xzf /tmp/osv-scanner.tar.gz -C /tmp osv-scanner
          chmod +x /tmp/osv-scanner
          export PATH="/tmp:$PATH"
          echo "/tmp" >> "$GITHUB_PATH"
        fi
        scan_exit=0
        osv-scanner scan --recursive --format sarif --output '${{ inputs.output }}' . || scan_exit=$?
        [ -f '${{ inputs.output }}' ] || echo '{"version":"2.1.0","runs":[]}' > '${{ inputs.output }}'
        if [ '${{ inputs.fail-on }}' = 'true' ] && [ "$scan_exit" -ne 0 ]; then
          echo 'osv-scanner reported findings (fail-on=true)' >&2
          exit 1
        fi
    # Pinned: upload-sarif v3 as of 2026-09-18 (3ea06614dafe36dec890db3446326e0d40ce53d4).
    # Keep updated via Dependabot; use the SHA, not the floating tag.
    - uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
      if: always()
      with:
        sarif_file: ${{ inputs.output }}
        category: osv-scanner
