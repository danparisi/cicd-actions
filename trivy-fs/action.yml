name: Trivy FS
description: Run Trivy filesystem scan (HIGH,CRITICAL) and upload SARIF (blocking by default; set fail-on=false for informational)
inputs:
  output:
    description: SARIF output path
    required: false
    default: reports/sarif/trivy-fs.sarif
  severity:
    description: Comma-separated severities that fail the scan
    required: false
    default: HIGH,CRITICAL
  fail-on:
    description: Fail the workflow when findings are reported ('true') or only upload SARIF as informational ('false')
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - shell: bash
      run: mkdir -p "$(dirname '${{ inputs.output }}')"
    - uses: aquasecurity/trivy-action@v0.24.0
      continue-on-error: ${{ inputs.fail-on != 'true' }}
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: ${{ inputs.output }}
        severity: ${{ inputs.severity }}
    - shell: bash
      if: always()
      run: |
        [ -f '${{ inputs.output }}' ] || echo '{"version":"2.1.0","runs":[]}' > '${{ inputs.output }}'
    # Disk hygiene (lenovo-m80q / at 83%): the trivy DB (~1.3G) downloads
    # into the job's _temp dir on every run (fresh dirs, nothing shared).
    # Delete it right after the scan; backstop is the 24h /_work prune.
    # Scoped rm only — never broad deletes under RUNNER_TEMP.
    - shell: bash
      if: always()
      run: |
        rm -rf "${RUNNER_TEMP}/_github_home/.cache/trivy" "${GITHUB_WORKSPACE}/../_temp/_github_home/.cache/trivy" 2>/dev/null || true
        find "${RUNNER_TEMP}" -maxdepth 6 -name 'trivy.db' -delete 2>/dev/null || true
    # Pinned: upload-sarif v4 as of 2026-09-20 (d8073367669608af8fbcc5f63dd0a0d52bb90cff).
    # Keep updated via Dependabot; use the SHA, not the floating tag.
    - uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
      if: always()
      # Best-effort: code scanning may be disabled (private repos without GHAS).
      # SARIF files are still preserved via the caller's upload-artifact step.
      continue-on-error: true
      with:
        sarif_file: ${{ inputs.output }}
        category: trivy-fs
