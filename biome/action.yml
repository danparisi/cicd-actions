name: Biome check
description: Run Biome ci on frontend/ and upload SARIF (warn-only by default; set fail-on=true to block)
inputs:
  output:
    description: SARIF output path
    required: false
    default: reports/sarif/biome.sarif
  working-directory:
    description: Frontend directory containing the Biome config
    required: false
    default: frontend
  version:
    description: '@biomejs/biome npm version to run'
    required: false
    default: 2.5.12
  fail-on:
    description: Fail the workflow when findings are reported ('true') or only upload SARIF as informational ('false')
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p "$(dirname '${{ inputs.output }}')"
        scan_exit=0
        npx --yes '@biomejs/biome@${{ inputs.version }}' ci '${{ inputs.working-directory }}' --reporter=sarif --reporter-file='${{ inputs.output }}' || scan_exit=$?
        [ -f '${{ inputs.output }}' ] || echo '{"version":"2.1.0","runs":[]}' > '${{ inputs.output }}'
        if [ '${{ inputs.fail-on }}' = 'true' ] && [ "$scan_exit" -ne 0 ]; then
          echo 'biome reported findings (fail-on=true)' >&2
          exit 1
        fi
    # Pinned: upload-sarif v4 as of 2026-09-20 (d8073367669608af8fbcc5f63dd0a0d52bb90cff).
    # Keep updated via Dependabot; use the SHA, not the floating tag.
    - uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
      if: always()
      # Best-effort: code scanning may be disabled (private repos without GHAS).
      # SARIF files are still preserved via the caller's upload-artifact step.
      continue-on-error: true
      with:
        sarif_file: ${{ inputs.output }}
        category: biome
